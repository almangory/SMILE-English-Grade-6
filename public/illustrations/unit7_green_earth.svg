<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="earthSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="50%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow7" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#earthSky)"/>

  <!-- 1. The Green Earth (Left) -->
  <g transform="translate(180, 240)" filter="url(#shadow7)">
    <!-- Globe -->
    <circle cx="0" cy="0" r="80" fill="url(#globeGrad)"/>
    <!-- Continents (Africa and surrounding) -->
    <path d="M-15 -60 Q10 -50 35 -30 Q40 0 10 25 Q-10 60 -5 75 Q-30 60 -35 20 Q-40 -20 -15 -60 Z" fill="#22c55e"/>
    <path d="M30 -65 Q60 -50 65 -20 Q40 -15 30 -65 Z" fill="#16a34a"/>
    <!-- Green Leaves wrapping around the Earth -->
    <path d="M-75 30 Q-95 -20 -60 -60 Q-40 -40 -50 10 Z" fill="#15803d"/>
    <path d="M75 30 Q95 -20 60 -60 Q40 -40 50 10 Z" fill="#16a34a"/>
    <text x="0" y="105" font-family="sans-serif" font-size="14" font-weight="900" fill="#15803d" text-anchor="middle">Keep the Earth Clean &amp; Green</text>
  </g>

  <!-- 2. The Four Recycling Boxes (Center) -->
  <g transform="translate(430, 245)" filter="url(#shadow7)">
    <!-- Glass Box (Cyan) -->
    <g transform="translate(-105, 0)">
      <rect x="-30" y="-35" width="60" height="60" rx="8" fill="#0284c7"/>
      <rect x="-35" y="-45" width="70" height="12" rx="4" fill="#0369a1"/>
      <text x="0" y="-10" font-family="sans-serif" font-size="20" text-anchor="middle">🥛</text>
      <text x="0" y="15" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">GLASS</text>
    </g>
    <!-- Metal Box (Orange) -->
    <g transform="translate(-35, 0)">
      <rect x="-30" y="-35" width="60" height="60" rx="8" fill="#f97316"/>
      <rect x="-35" y="-45" width="70" height="12" rx="4" fill="#ea580c"/>
      <text x="0" y="-10" font-family="sans-serif" font-size="20" text-anchor="middle">🥫</text>
      <text x="0" y="15" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">METAL</text>
    </g>
    <!-- Plastic Box (Yellow) -->
    <g transform="translate(35, 0)">
      <rect x="-30" y="-35" width="60" height="60" rx="8" fill="#eab308"/>
      <rect x="-35" y="-45" width="70" height="12" rx="4" fill="#ca8a04"/>
      <text x="0" y="-10" font-family="sans-serif" font-size="20" text-anchor="middle">🥤</text>
      <text x="0" y="15" font-family="sans-serif" font-size="10" font-weight="bold" fill="#713f12" text-anchor="middle">PLASTIC</text>
    </g>
    <!-- Paper Box (Blue) -->
    <g transform="translate(105, 0)">
      <rect x="-30" y="-35" width="60" height="60" rx="8" fill="#3b82f6"/>
      <rect x="-35" y="-45" width="70" height="12" rx="4" fill="#2563eb"/>
      <text x="0" y="-10" font-family="sans-serif" font-size="20" text-anchor="middle">📰</text>
      <text x="0" y="15" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">PAPER</text>
    </g>
    
    <text x="0" y="60" font-family="sans-serif" font-size="14" font-weight="900" fill="#0369a1" text-anchor="middle">Classroom Recycling</text>
  </g>

  <!-- 3. Fox & Crow and Ancient Writing (Right) -->
  <g transform="translate(680, 235)" filter="url(#shadow7)">
    <!-- Tree branch -->
    <rect x="-50" y="-30" width="80" height="10" rx="5" fill="#78350f"/>
    <!-- Crow with cheese -->
    <circle cx="-25" cy="-45" r="14" fill="#18181b"/>
    <polygon points="-40,-47 -25,-43 -25,-52" fill="#fbbf24"/><!-- beak -->
    <polygon points="-50,-40 -40,-48 -40,-35" fill="#facc15"/><!-- cheese wedge -->
    
    <!-- Fox below looking up -->
    <ellipse cx="10" cy="20" rx="25" ry="16" fill="#ea580c"/>
    <circle cx="28" cy="8" r="12" fill="#ea580c"/><!-- fox head -->
    <polygon points="25,-2 28,8 20,4" fill="#c2410c"/><!-- ear -->
    <polygon points="35,-2 38,8 30,4" fill="#c2410c"/><!-- ear -->
    <polygon points="35,10 44,12 35,14" fill="#18181b"/><!-- nose -->
    <!-- Bushy tail -->
    <ellipse cx="-15" cy="18" rx="15" ry="9" fill="#c2410c" transform="rotate(-30 -15 18)"/>
    <circle cx="-25" cy="13" r="5" fill="#ffffff"/><!-- white tail tip -->
    
    <text x="0" y="65" font-family="sans-serif" font-size="13" font-weight="900" fill="#c2410c" text-anchor="middle">The Fox &amp; Crow</text>
  </g>

  <!-- Header Banner Badge -->
  <g transform="translate(400, 45)">
    <rect x="-170" y="-22" width="340" height="44" rx="22" fill="#ffffff" filter="url(#shadow7)"/>
    <text x="0" y="6" font-family="sans-serif" font-size="18" font-weight="900" fill="#047857" text-anchor="middle" letter-spacing="1">UNIT 7: ONE MORE TIME</text>
  </g>
</svg>
