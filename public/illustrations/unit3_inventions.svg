<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="nileGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="wheelWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Sky & Sun -->
  <rect width="800" height="450" fill="url(#skyGrad3)"/>
  <circle cx="680" cy="90" r="50" fill="#fef08a" opacity="0.85" filter="url(#shadow3)"/>
  <circle cx="680" cy="90" r="65" fill="#fef9c3" opacity="0.3"/>

  <!-- Background Hills & Palm Trees -->
  <path d="M0 320 Q200 280 400 310 T800 300 L800 450 L0 450 Z" fill="#86efac" opacity="0.6"/>
  <path d="M0 350 Q250 320 500 340 T800 330 L800 450 L0 450 Z" fill="#4ade80"/>

  <!-- River Nile -->
  <path d="M0 380 Q300 360 500 390 T800 385 L800 450 L0 450 Z" fill="url(#nileGrad3)"/>

  <!-- Palm Tree Left -->
  <path d="M90 380 Q95 240 120 160 Q105 240 100 380 Z" fill="#78350f"/>
  <ellipse cx="125" cy="150" rx="60" ry="20" fill="#15803d" transform="rotate(-30 125 150)"/>
  <ellipse cx="125" cy="150" rx="60" ry="20" fill="#16a34a" transform="rotate(20 125 150)"/>
  <ellipse cx="125" cy="150" rx="65" ry="22" fill="#22c55e" transform="rotate(70 125 150)"/>
  <ellipse cx="125" cy="150" rx="65" ry="22" fill="#15803d" transform="rotate(-80 125 150)"/>

  <!-- The Traditional Saqia Waterwheel (Center) -->
  <g transform="translate(380, 290)" filter="url(#shadow3)">
    <!-- Wooden Support Posts -->
    <path d="M-60 90 L-10 -70 L10 -70 L60 90 Z" fill="#78350f"/>
    <!-- Wheel Outer Rings -->
    <circle cx="0" cy="0" r="95" stroke="url(#wheelWood)" stroke-width="12" fill="none"/>
    <circle cx="0" cy="0" r="80" stroke="#f59e0b" stroke-width="4" fill="none"/>
    <circle cx="0" cy="0" r="25" fill="#78350f"/>
    <!-- Spokes -->
    <line x1="0" y1="-95" x2="0" y2="95" stroke="#92400e" stroke-width="6"/>
    <line x1="-95" y1="0" x2="95" y2="0" stroke="#92400e" stroke-width="6"/>
    <line x1="-67" y1="-67" x2="67" y2="67" stroke="#92400e" stroke-width="6"/>
    <line x1="67" y1="-67" x2="-67" y2="67" stroke="#92400e" stroke-width="6"/>
    <!-- Clay Pots (Gawadis) on the Wheel -->
    <rect x="-10" y="-110" width="20" height="25" rx="5" fill="#ea580c"/>
    <rect x="90" y="-10" width="25" height="20" rx="5" fill="#ea580c"/>
    <rect x="-10" y="85" width="20" height="25" rx="5" fill="#ea580c"/>
    <rect x="-115" y="-10" width="25" height="20" rx="5" fill="#ea580c"/>
    <rect x="60" y="-80" width="22" height="22" rx="5" fill="#c2410c"/>
    <rect x="-80" y="60" width="22" height="22" rx="5" fill="#c2410c"/>
    <!-- Sparkling Water Spill -->
    <path d="M10 -60 Q40 0 60 80" stroke="#38bdf8" stroke-width="6" stroke-dasharray="4,4" fill="none" opacity="0.9"/>
  </g>

  <!-- Leonardo Da Vinci Parachute in Sky (Left top) -->
  <g transform="translate(220, 90)" filter="url(#shadow3)">
    <!-- Pyramid canvas parachute -->
    <polygon points="0,-40 -40,10 40,10" fill="#fef08a" stroke="#d97706" stroke-width="3"/>
    <line x1="-40" y1="10" x2="0" y2="50" stroke="#78350f" stroke-width="2"/>
    <line x1="40" y1="10" x2="0" y2="50" stroke="#78350f" stroke-width="2"/>
    <line x1="0" y1="10" x2="0" y2="50" stroke="#78350f" stroke-width="2"/>
    <circle cx="0" cy="55" r="7" fill="#dc2626"/>
    <text x="0" y="80" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">Da Vinci Parachute</text>
  </g>

  <!-- Modern Motor Pump (Right) -->
  <g transform="translate(620, 320)" filter="url(#shadow3)">
    <rect x="-35" y="-30" width="70" height="50" rx="8" fill="#dc2626"/>
    <rect x="-25" y="-20" width="50" height="30" rx="4" fill="#991b1b"/>
    <circle cx="0" cy="-5" r="10" fill="#fef08a"/>
    <rect x="35" y="-15" width="25" height="15" fill="#475569"/>
    <!-- Blue Water Outflow Pipe -->
    <path d="M45 -10 Q70 -10 80 40" stroke="#38bdf8" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M45 -10 Q70 -10 80 40" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="0" y="45" font-family="sans-serif" font-size="12" font-weight="900" fill="#7f1d1d" text-anchor="middle">Modern Pump</text>
  </g>

  <!-- Banner Header Badge -->
  <g transform="translate(400, 45)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="#ffffff" filter="url(#shadow3)"/>
    <text x="0" y="6" font-family="sans-serif" font-size="18" font-weight="900" fill="#6b21a8" text-anchor="middle" letter-spacing="1">UNIT 3: INVENTIONS &amp; NEW THINGS</text>
  </g>
</svg>
