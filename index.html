<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- 🔒 Security Headers & Policies -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https://dict.youdao.com https://translate.google.com; connect-src 'self' https://dict.youdao.com https://translate.google.com; font-src 'self' data:; object-src 'none'; base-uri 'self';" />
    
    <title>NAQLA English - SMILE Grade 6 (Sudan)</title>
    
    <!-- 🌟 أيقونة التطبيق والتبويب الرسمية -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- 📱 إعدادات تطبيق الويب التقدمي (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NAQLA English" />
    
    <!-- 🛡️ تسجيل Service Worker للعمل أوفلاين 100% -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('[PWA] Service Worker registered successfully:', reg.scope))
            .catch((err) => console.warn('[PWA] Service Worker registration failed:', err));
        });
      }
    </script>
    
    <!-- 🇸🇩 جسر الدخول الموحد التلقائي من منصة المناهج السودانية (Naqla SSO Receiver) -->
    <script>
      (function() {
        try {
          const hash = window.location.hash;
          if (hash && hash.includes('naqla_sso=')) {
            const params = new URLSearchParams(hash.replace(/^#/, ''));
            const ssoData = params.get('naqla_sso');
            if (ssoData) {
              const user = JSON.parse(decodeURIComponent(escape(atob(ssoData))));
              // التحقق من صلاحية التوكن (10 دقائق من تاريخ الإرسال)
              if (user && user.ts && (Date.now() - user.ts < 10 * 60 * 1000)) {
                console.log('🇸🇩 [منصة المناهج] تم تسجيل الدخول تلقائياً للمستخدم:', user.username);
                localStorage.setItem('sudan_auth_user', JSON.stringify(user));
                localStorage.setItem('currentUser', JSON.stringify(user));
                localStorage.setItem('user', JSON.stringify(user));
                // تنظيف شريط العنوان بحرفية
                params.delete('naqla_sso');
                const cleanHash = params.toString() ? '#' + params.toString() : '';
                window.history.replaceState(null, '', window.location.pathname + window.location.search + cleanHash);
              }
            }
          }
        } catch (e) {
          console.warn('Naqla SSO receiver error:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- 🌟 شاشة التحميل الفورية لشعار نقلة وشريط التقدم (تمنع الشاشة البيضاء تماماً أثناء تحميل المتصفح) -->
      <div id="naqla-initial-loader" style="position: fixed; inset: 0; z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #064E3B 0%, #032b20 60%, #021a14 100%); color: white; font-family: 'Tajawal', 'Cairo', system-ui, -apple-system, sans-serif; direction: rtl; user-select: none; text-align: center; padding: 20px;">
        <style>
          @keyframes naqlaPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(16, 185, 129, 0.4)); }
            50% { transform: scale(1.06); filter: drop-shadow(0 0 35px rgba(52, 211, 153, 0.75)); }
          }
          @keyframes naqlaProgress {
            0% { transform: translateX(100%); }
            50% { transform: translateX(0%); }
            100% { transform: translateX(-100%); }
          }
          .naqla-logo-anim {
            animation: naqlaPulse 2.4s ease-in-out infinite;
          }
          .naqla-bar-anim {
            animation: naqlaProgress 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
          }
        </style>
        
        <!-- شعار نقلة في المنتصف -->
        <div style="position: relative; width: 110px; height: 110px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center;">
          <img src="/naqla-logo.png" onerror="this.src='/icon-192.png'; this.onerror=null;" alt="منصة نقلة التعليمية" class="naqla-logo-anim" style="width: 100%; height: 100%; object-fit: contain; border-radius: 24px;" />
        </div>

        <!-- نصوص الهوية والتحميل -->
        <h2 style="margin: 0; font-size: 22px; font-weight: 800; color: #ffffff; letter-spacing: 0.3px;">منصة نقلة التعليمية</h2>
        <p style="margin: 8px 0 0 0; font-size: 13.5px; font-weight: 600; color: #a7f3d0; opacity: 0.95;">جاري فتح وتجهيز المادة التفاعلية...</p>

        <!-- شريط التقدم النيوني المتحرك -->
        <div style="width: 250px; max-width: 80vw; height: 6px; background: rgba(255, 255, 255, 0.12); border-radius: 9999px; overflow: hidden; margin-top: 24px; position: relative; border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);">
          <div class="naqla-bar-anim" style="width: 60%; height: 100%; border-radius: 9999px; background: linear-gradient(90deg, #10b981, #34d399, #6ee7b7); box-shadow: 0 0 12px rgba(52, 211, 153, 0.8);"></div>
        </div>

        <span style="margin-top: 14px; font-size: 11.5px; font-weight: 500; color: #6ee7b7; opacity: 0.85;">يرجى الانتظار لحظات معدودة...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
